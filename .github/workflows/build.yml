      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - run: cp proj/app/build/outputs/apk/debug/app-debug.apk PDF-by-twentycores.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-by-twentycores-apk
          path: PDF-by-twentycores.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-build-${{ github.run_number }}
          name: PDF by twentycores build ${{ github.run_number }}
          files: PDF-by-twentycores.apk
